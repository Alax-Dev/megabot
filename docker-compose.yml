services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: megabot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
      - DOWNLOAD_DIR=/app/downloads
      - SESSION_DIR=/app/sessions
    ports:
      - "8080:8080"
    volumes:
      - ./downloads:/app/downloads
      - ./sessions:/app/sessions
