services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: megabot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Uses MONGO_URL from .env if provided; otherwise falls back to local mongodb service
      - MONGO_URL=${MONGO_URL:-mongodb://mongodb:27017/megabot}
      - PORT=8080
      - DOWNLOAD_DIR=/app/downloads
      - SESSION_DIR=/app/sessions
    ports:
      - "8080:8080"
    volumes:
      - ./downloads:/app/downloads
      - ./sessions:/app/sessions
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:6.0
    container_name: megabot-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
    driver: local
